# Mount this file as $CODEX_HOME/config.toml for the coder container.
# This replaces the host Codex config, so host plugins and MCP servers are not loaded.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
approval_policy = "never"
cli_auth_credentials_store = "file"

developer_instructions = "You are the coder. Implement the plan in the workspace. Do not redesign it."

[projects."/workspace"]
trust_level = "trusted"
