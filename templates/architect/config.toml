# Mount this file as $CODEX_HOME/config.toml for the architect container.
# This replaces the host Codex config, so host plugins and MCP servers are not loaded.

model = "gpt-6.1-sol"
model_reasoning_effort = "high"
sandbox_mode = "read-only"
approval_policy = "never"
cli_auth_credentials_store = "file"

developer_instructions = "You are the architect. Design and plan only. Do not edit the workspace."

[projects."/workspace"]
trust_level = "trusted"
