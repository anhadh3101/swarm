# Codex in Docker with your host login (~/.codex).
#
#   docker compose build
#   docker compose run --rm -it codex          # interactive
#   docker compose exec codex codex --help     # if you used `up -d`

name: agent-swarm

services:
  codex:
    build: ./agent
    environment:
      CODEX_HOME: /home/codex/.codex
    volumes:
      - ${CODEX_HOME_HOST:-${HOME}/.codex}:/home/codex/.codex
      - .:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
